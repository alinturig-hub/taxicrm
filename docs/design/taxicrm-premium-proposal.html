<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaxiCRM — propunere premium</title>
<style>
:root{--bg:#F7F6F2;--panel:#fff;--text:#202733;--muted:#566171;--line:#E0E3E5;--brand:#0F766E;--soft:#E8F3F0;--gold:#B59A68;--good:#18794E;--warn:#9A5B13;--bad:#B42336;--sidebar:#171C25;--shadow:0 2px 8px #171c2505;--chart:#b6d8cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}a{color:var(--brand)}button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:3px}.dark{--bg:#141820;--panel:#1E242E;--text:#F0F2F4;--muted:#B0BAC7;--line:#39424E;--brand:#82CBB8;--soft:#263E38;--good:#86D5AE;--warn:#EBC689;--bad:#F7A2AD;--chart:#44796b}.dark .primary{background:#0F766E;color:white}.sidebar{position:fixed;inset:0 auto 0 0;width:230px;background:var(--sidebar);color:#E4E8EE;display:flex;flex-direction:column;z-index:30;padding:24px 16px;border-top:3px solid var(--gold)}.logo{display:flex;align-items:center;gap:11px;padding:0 8px 24px}.mark{display:grid;place-items:center;background:#0F766E;width:35px;height:35px;border-radius:10px;font-size:18px;font-weight:700}.logo strong{display:block;font-size:17px;letter-spacing:-.5px}.logo small{font-size:10px;letter-spacing:1.8px;color:#A4AFBE}.nav-label{margin:14px 12px 8px;color:#A4AFBE;font-size:10px;letter-spacing:1.8px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#C2CBD6;padding:11px 12px;text-align:left;border-radius:8px;font-weight:500}.nav button.active{background:#2A3F3E;color:#BFE7DB}.nav button:hover{background:#28303A}.nav .dot{width:18px;color:#A4AFBE;text-align:center;font-size:16px}.admin{margin-top:auto}.profile{margin-top:20px;padding:15px 10px;border-top:1px solid #39424E;font-size:12px}.profile small{display:block;color:#A4AFBE}.close-nav{display:none}.main{margin-left:230px}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;border-bottom:1px solid var(--line);background:var(--panel)}.breadcrumb{font-size:12px;color:var(--muted)}.tools{display:flex;gap:10px;align-items:center}.secondary{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:8px}.primary{border:1px solid #0F766E;background:#0F766E;color:#fff;padding:9px 14px;border-radius:8px;font-weight:600}.demo{font-size:10px;letter-spacing:1px;color:var(--warn);white-space:nowrap}.content{max-width:1480px;margin:auto;padding:30px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}h1{font-size:29px;line-height:1.2;letter-spacing:-.9px;margin:8px 0 10px}h2{font-size:16px;letter-spacing:-.3px;margin:0}h3{font-size:14px;margin:0}p{margin:0}.muted{color:var(--muted)}.page-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:26px}.page-head p{max-width:680px}.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;border-radius:5px;padding:3px 7px;background:var(--soft);color:var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.stat{padding:18px 20px}.stat-label{color:var(--muted);font-size:12px}.value{font-size:27px;letter-spacing:-1px;font-weight:600;margin:7px 0 2px;font-variant-numeric:tabular-nums}.stat small{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:20px}.panel-header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:10px}.panel-content{padding:20px}.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 92px;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row p{font-size:12px;color:var(--muted);margin-top:4px}.status{color:var(--warn);font-size:11px;font-weight:600}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.owner{font-size:12px;color:var(--muted)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.steps span{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px}.steps .current{background:var(--soft);border-color:var(--brand);color:var(--brand)}.note{border-left:2px solid var(--gold);padding-left:12px;font-size:12px;color:var(--muted);margin:16px 0}.charts{display:flex;align-items:end;gap:10px;height:130px;margin-top:16px}.bar{flex:1;background:var(--chart);border-radius:4px 4px 0 0;min-width:10px}.bar.emphasis{background:var(--brand)}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:22px;font-size:11px;color:var(--muted)}.palette{display:flex;gap:7px;align-items:center}.swatch{width:15px;height:15px;border-radius:4px;border:1px solid var(--line)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;padding:12px 18px;border-bottom:1px solid var(--line)}.table td{padding:14px 18px;font-size:12px;border-bottom:1px solid var(--line)}.table tr:last-child td{border-bottom:0}.table td strong{font-weight:600}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:22px}.card p{color:var(--muted);margin-top:8px;font-size:13px}.card .secondary{margin-top:18px}.search-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}.pill{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted)}.pill.selected{background:var(--soft);border-color:var(--brand);color:var(--brand)}.mobile-menu{display:none}.backdrop{display:none}.dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:24px;width:min(560px,90vw)}.dialog::backdrop{background:#171c2580}.dialog p{margin:12px 0}.dialog .secondary{float:right}.dialog h2{padding-right:60px}@media(max-width:1100px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.sidebar{display:none}.main{margin-left:0}.content{padding:20px 16px}.topbar{padding:0 16px}.mobile-menu{display:block}.breadcrumb{display:none}.close-nav{display:block;margin-bottom:12px;color:#E4E8EE;border-color:#39424E;background:#28303A}.nav-open .sidebar{display:flex}.nav-open .backdrop{display:block;position:fixed;inset:0;background:#0008;border:0;z-index:25}.page-head{align-items:start;flex-direction:column}.stats{gap:10px}.stat{padding:14px}.value{font-size:24px}.cards{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) 82px}.row .owner{grid-column:1/-1}.tools .demo{font-size:9px}.topbar{gap:8px}.row{padding:14px 16px}.panel-header,.panel-content{padding:16px}}
</style></head><body>
<button class="backdrop" aria-label="Închide meniul" onclick="closeNav()"></button>
<aside class="sidebar" aria-label="Navigație propusă"><button class="secondary close-nav" onclick="closeNav()">Închide meniul</button><div class="logo"><span class="mark">T</span><div><strong>TaxiCRM</strong><small>OPERATIONS & RELATIONSHIPS</small></div></div><div class="nav-label">SPAȚIU DE LUCRU</div><nav class="nav" id="daily"></nav><div class="admin"><div class="nav-label">ADMINISTRARE</div><nav class="nav" id="admin"></nav><div class="profile">Echipă demonstrativă<small>Design concept · date sintetice</small></div></div></aside>
<div class="main"><header class="topbar"><button class="secondary mobile-menu" aria-label="Deschide meniul" onclick="document.body.classList.add('nav-open')">☰</button><div class="breadcrumb">TaxiCRM <span aria-hidden="true"> / </span> <strong id="crumb">Astăzi</strong></div><div class="tools"><span class="demo">PROTOTIP · DATE SINTETICE</span><button class="secondary" id="theme" onclick="toggleTheme()">Dark mode</button></div></header><main class="content" id="content"></main></div>
<dialog class="dialog" id="details"><button class="secondary" onclick="document.getElementById('details').close()">Închide</button><h2 id="detail-title">Acțiune propusă</h2><div id="detail-body"></div></dialog>
<script>
const views=[['today','Astăzi','◷'],['operations','Operațiuni','◈'],['customers','Clienți','◎'],['marketing','Marketing','↗'],['performance','Performanță','▥'],['integrations','Integrări','⇄'],['configuration','Configurare','⚙']];
let current='today';
function closeNav(){document.body.classList.remove('nav-open')}
function toggleTheme(){const dark=document.body.classList.toggle('dark');document.getElementById('theme').textContent=dark?'Light mode':'Dark mode'}
function nav(){views.forEach(([id,label,icon],i)=>{const button=document.createElement('button');button.dataset.view=id;button.innerHTML=`<span class="dot" aria-hidden="true">${icon}</span>${label}`;button.onclick=()=>show(id);document.getElementById(i<5?'daily':'admin').appendChild(button)})}
function head(title,sub,meta='WORKSPACE / ECHIPĂ DEMONSTRATIVĂ'){return `<div class="page-head"><div><div class="eyebrow">${meta}</div><h1>${title}</h1><p class="muted">${sub}</p></div><span class="tag">Europe/London · perioadă demo</span></div>`}
function stat(label,value,desc){return `<div class="panel stat"><div class="stat-label">${label}</div><div class="value">${value}</div><small>${desc}</small></div>`}
function foot(){return `<footer class="footer"><span>Concept de design. Acțiunile, responsabilitățile și cifrele de mai sus sunt demonstrative.</span><div class="palette"><span>Graphite · Ivory · Petrol</span>${['#171C25','#F7F6F2','#0F766E','#B59A68'].map(c=>`<span class="swatch" style="background:${c}" title="${c}"></span>`).join('')}</div></footer>`}
function demand(){return `<div class="charts" role="img" aria-label="Grafic demonstrativ: cererea crește spre seară">${[34,45,38,61,52,74,92,82,62,46].map((h,i)=>`<span class="bar ${i===6?'emphasis':''}" style="height:${h}%"></span>`).join('')}</div><div class="chart-labels"><span>06:00</span><span>12:00</span><span>18:00</span><span>00:00</span></div>`}
function evidence(title){document.getElementById('detail-title').textContent=title;document.getElementById('detail-body').innerHTML='<p><strong>Semnal:</strong> linie demonstrativă fără bookinguri în fereastra urmărită.</p><p><strong>Dovezi:</strong> interval de 12 ore, date sintetice. Lipsa bookingurilor nu demonstrează un defect al telefonului.</p><p><strong>Responsabil propus:</strong> coordonator operațiuni.</p><p><strong>Acțiune:</strong> verifică linia și feedul de bookinguri; consemnează rezultatul.</p><p><strong>Feedback:</strong> confirmă revenirea activității și calitatea datelor.</p><div class="note">Acest flux de activități este propus pentru dezvoltare. Prototipul nu trimite SMS și nu modifică TaxiCRM.</div>';document.getElementById('details').showModal()}
function today(){return head('O zi clară. O echipă aliniată.','Prioritățile operațiunii, relațiile cu clienții și următoarele acțiuni, într-un singur loc.')+`<div class="stats">${stat('Bookinguri demo','128','Volum sintetic, nu date live')}${stat('Șoferi activi demo','24','Distribuție ilustrativă')}${stat('Semnale de verificat','3','Propunere de triere')}${stat('Acțiuni cu responsabil','5','Funcție propusă')}</div><div class="grid"><section class="panel"><div class="panel-header"><h2>Necesită atenție</h2><span class="tag">Semnal → acțiune</span></div><div class="row"><div><h3>Verifică linia North Hub</h3><p>Fără bookinguri în fereastra demo de 12 ore.</p></div><span class="status">● De verificat</span><span class="owner">Operațiuni<br>14:00 · demo</span></div><div class="row"><div><h3>Validează 4 valori fare</h3><p>Date lipsă; nu le interpretăm ca £0.00.</p></div><span class="status">● Date lipsă</span><span class="owner">Date & integrări<br>15:00 · demo</span></div><div class="row"><div><h3>Revizuiește segmentul „Regular”</h3><p>Compară activitatea cu perioada relevantă.</p></div><span class="status good">● Pentru review</span><span class="owner">CRM<br>16:00 · demo</span></div><div class="panel-content"><button class="primary" onclick="evidence('Verificarea liniei North Hub')">Vezi procesul propus</button></div></section><div><section class="panel"><div class="panel-header"><h2>Cerere pe ore</h2><span class="eyebrow">DEMO</span></div><div class="panel-content">${demand()}</div></section><section class="panel" style="margin-top:20px"><div class="panel-content"><h2>O buclă completă de lucru</h2><div class="steps"><span class="current">Semnal</span><span>Responsabil</span><span>Acțiune</span><span>Rezultat</span><span>Feedback</span></div><p class="muted" style="font-size:12px">Adaptare de produs inspirată de cooperare, delegare și urmărirea rezultatelor în coachingul sistemic.</p></div></section></div></div>`}
function operations(){return head('Operațiuni','Curse, șoferi și acoperire. Excepțiile sunt vizibile, fără să ascundă activitatea normală.')+`<div class="search-line"><span class="pill selected">Bookings</span><span class="pill">Live</span><span class="pill">Drivers</span><span class="pill">Fleet</span><span class="pill">Zones</span></div><section class="panel"><div class="panel-header"><h2>Bookinguri demonstrative</h2><span class="eyebrow">LISTĂ + DETALIU</span></div><div class="table-wrap"><table class="table"><thead><tr><th>BOOKING</th><th>CLIENT</th><th>ȘOFER / BADGE</th><th>STATUS</th><th>FARE</th></tr></thead><tbody><tr><td>DEMO-1001</td><td>Client demonstrativ A</td><td>Driver A / DEMO-14</td><td class="status good">Completed</td><td>£18.40 · sintetic</td></tr><tr><td>DEMO-1002</td><td>Client demonstrativ B</td><td>Driver B / DEMO-09</td><td class="status">Dispatched</td><td>£12.20 · sintetic</td></tr><tr><td>DEMO-1003</td><td>Client demonstrativ C</td><td>—</td><td class="status">De verificat</td><td>Lipsă</td></tr></tbody></table></div></section><div class="note">Bookingurile nu se transformă într-un pipeline de vânzări. Asocierea după badge și regulile financiare existente se păstrează.</div>`}
function customers(){return head('Clienți','Un profil comun pentru operațiuni și marketing, cu istoricul și dovezile într-un singur loc.')+`<div class="search-line"><span class="pill selected">Toți clienții</span><span class="pill">Account</span><span class="pill">Individual</span><span class="pill">Filtre salvate</span></div><div class="cards"><section class="panel card"><div class="eyebrow">PROFIL DEMO</div><h2 style="margin-top:10px">Client demonstrativ A</h2><p>Regular route · Advance booker</p><div class="steps"><span class="current">Overview</span><span>Bookings</span><span>Places</span><span>Activity</span></div><p>Istoric, fare verificat, locuri și oportunități. Fiecare predicție are o perioadă și dovezi.</p></section><section class="panel card"><div class="eyebrow">RELAȚII DEMO</div><h2 style="margin-top:10px">Client → Booking → Driver → Place</h2><p>Account și contactele sale rămân legate, fără profile duplicate între echipe.</p><div class="note">Activity cu owner și termen necesită dezvoltare ulterioară. Nu este prezentată drept funcție live.</div></section></div>`}
function marketing(){return head('Marketing','De la segment și dovezi la o acțiune măsurabilă, cu review înainte de outreach.')+`<div class="stats">${stat('Segmente demo','6','Exemplu de organizare')}${stat('Oportunități demo','12','Review al dovezilor')}${stat('Acțiuni planificate','4','Funcție propusă')}${stat('Campanii active','—','Modul viitor, neimplementat')}</div><div class="cards"><section class="panel card"><h2>Audiențe și oportunități</h2><p>Folosește tagurile și predicțiile existente, cu perioadă, încredere și calitatea datelor vizibile.</p><div class="steps"><span class="current">Segment</span><span>Review</span><span>Acțiune</span><span>Rezultat</span></div></section><section class="panel card"><h2>Urmărește efectul</h2><p>Responsabil, obiectiv și interval de evaluare. Acest flux este propus; nu există trimitere de campanii în prototip.</p><div class="note">Nu deducem rezultate comerciale dintr-o predicție fără dovezi de activitate.</div></section></div>`}
function performance(){return head('Performanță','Indicatori de business, performanța șoferilor și predicții, cu perioade și surse vizibile.')+`<div class="search-line"><span class="pill selected">Business</span><span class="pill">Hackney</span><span class="pill">Customer intelligence</span><span class="pill">Reports</span></div><div class="grid"><section class="panel"><div class="panel-header"><h2>Volum demonstrativ</h2><span class="tag">Perioadă demo</span></div><div class="panel-content">${demand()}<p class="muted" style="margin-top:20px;font-size:12px">Compare aceeași perioadă de business, cu Europe/London și lipsurile de date explicit marcate.</p></div></section><section class="panel card"><h2>De la indicator la decizie</h2><p>Ce observăm? Ce depinde de echipă? Cine verifică? Când evaluăm rezultatul?</p><div class="note">AI poate ajuta în context. Nu înlocuiește dovada, responsabilul sau regula financiară.</div></section></div>`}
function integrations(){return head('Integrări','Două surse de lucru. Conexiunea, datele și istoricul sunt ușor de diferențiat.')+`<div class="cards"><section class="panel card"><div class="tag">MODUL EXISTENT</div><h2 style="margin-top:14px">Autocab</h2><p>Conexiune, date API, webhookuri și evenimente primite.</p><div class="steps"><span>Connection</span><span>Data</span><span>Webhooks</span><span>History</span></div></section><section class="panel card"><div class="tag">MODUL EXISTENT / PARȚIAL</div><h2 style="margin-top:14px">Local</h2><p>Import JSON, preview și date salvate. Conexiunea către un sistem local așteaptă protocolul și endpointul.</p><div class="steps"><span>Import</span><span>Saved data</span><span>Connection setup</span></div></section></div><div class="note">Prototipul nu testează conexiuni și nu accesează sistemele externe.</div>`}
function configuration(){return head('Configurare','Setările importante, grupate după responsabilitate și impact.')+`<div class="cards">${[['Reguli de business','Account revenue rules · Driver rent · Perioade Europe/London'],['Comunicare','SMS gateway · Freephone workflows · Delivery history'],['Date & integrări','Providers · API records · Places · Calendar'],['Acces & control','Users · Roles · System health · Audit']].map(([title,desc])=>`<section class="panel card"><h2>${title}</h2><p>${desc}</p></section>`).join('')}</div><div class="note">Oprirea integrărilor rămâne o acțiune distinctă, cu confirmare și consecințe explicite.</div>`}
const renders={today,operations,customers,marketing,performance,integrations,configuration};
function show(id){current=id;document.getElementById('content').innerHTML=renders[id]()+foot();document.getElementById('crumb').textContent=views.find(v=>v[0]===id)[1];document.querySelectorAll('[data-view]').forEach(button=>{const active=button.dataset.view===id;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});closeNav()}
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeNav()});nav();show(current);
</script></body></html>
